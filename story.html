<style>

[一 · 开学,餐厅]
旁白 | 今天开学。力波在餐厅,他很高兴。 | Jīntiān kāixué. Lìbō zài cāntīng, tā hěn gāoxìng. | School starts today. Libo is in the restaurant, and he is happy.
力波 | 请问,这儿有人吗? | Qǐngwèn, zhèr yǒu rén ma? | Excuse me, is anyone sitting here?
林娜 | 没有。请坐。 | Méiyǒu. Qǐng zuò. | No. Please sit.
力波 | 谢谢!请问,您贵姓? | Xièxie! Qǐngwèn, nín guìxìng? | Thanks! May I ask, what is your (polite) surname?
林娜 | 您?我是学生,不是老师! | Nín? Wǒ shì xuésheng, bú shì lǎoshī! | "Nín"? I'm a student, not a teacher!
力波 | 对不起,对不起!今天我太高兴了! | Duìbuqǐ, duìbuqǐ! Jīntiān wǒ tài gāoxìng le! | Sorry, sorry! I'm just so happy today!
林娜 | 没关系。我叫林娜。你叫什么名字? | Méi guānxi. Wǒ jiào Lín Nà. Nǐ jiào shénme míngzi? | It's okay. I'm Lin Na. What's your name?
力波 | 我叫丁力波。认识你很高兴。 | Wǒ jiào Dīng Lìbō. Rènshi nǐ hěn gāoxìng. | I'm Ding Libo. Nice to meet you.
林娜 | 我也很高兴。你是哪国人? | Wǒ yě hěn gāoxìng. Nǐ shì nǎ guó rén? | Me too. Which country are you from?
力波 | 我是加拿大人。你呢? | Wǒ shì Jiānádà rén. Nǐ ne? | I'm Canadian. And you?
林娜 | 我是英国人。你说汉语,太好了! | Wǒ shì Yīngguó rén. Nǐ shuō Hànyǔ, tài hǎo le! | I'm British. You speak Chinese, that's great!
力波 | 不,不!你的普通话太好了! | Bù, bù! Nǐ de pǔtōnghuà tài hǎo le! | No, no! Your Mandarin is so good!
林娜 | 你在哪儿学习?你的专业是什么? | Nǐ zài nǎr xuéxí? Nǐ de zhuānyè shì shénme? | Where do you study? What is your major?
力波 | 我在外语学院的中文系。我的专业是文学。你呢? | Wǒ zài wàiyǔ xuéyuàn de Zhōngwén xì. Wǒ de zhuānyè shì wénxué. Nǐ ne? | At the foreign languages institute, Chinese department. My major is literature. And you?
林娜 | 我也在这个学院的外语系。我学习语言,专业是教育。 | Wǒ yě zài zhège xuéyuàn de wàiyǔ xì. Wǒ xuéxí yǔyán, zhuānyè shì jiàoyù. | Same institute, foreign languages department. I study languages, my major is education.
林娜 | 你喝咖啡吗?我今天还没喝!我要一杯。 | Nǐ hē kāfēi ma? Wǒ jīntiān hái méi hē! Wǒ yào yì bēi. | Do you drink coffee? I haven't had any yet today! I want a cup.
力波 | 我也要!这是我的名片。 | Wǒ yě yào! Zhè shì wǒ de míngpiàn. | Me too! This is my name card.
林娜 | 你的名字很有意思! | Nǐ de míngzi hěn yǒuyìsi! | Your name is very interesting!
[二 · 课堂,张教授]
林娜 | 昨天天气不好,今天天气很好。明天天气怎么样? | Zuótiān tiānqì bù hǎo, jīntiān tiānqì hěn hǎo. Míngtiān tiānqì zěnmeyàng? | Yesterday the weather was bad, today the weather is good. How will tomorrow be?
力波 | 我不知道。看,张教授! | Wǒ bù zhīdào. Kàn, Zhāng jiàoshòu! | I don't know. Look, Professor Zhang!
张教授 | 请进来,请坐。你们好!我是张教授,我是系主任,也教你们汉语。 | Qǐng jìnlái, qǐng zuò. Nǐmen hǎo! Wǒ shì Zhāng jiàoshòu, wǒ shì xìzhǔrèn, yě jiāo nǐmen Hànyǔ. | Please come in, sit down. Hello, everyone! I'm Professor Zhang, the department head, and I'll also teach you Chinese.
林娜 | 张老师,您好! | Zhāng lǎoshī, nín hǎo! | Hello, Teacher Zhang!
张教授 | 这儿不说英语,说汉语!这位是我们的助教,杨小姐。 | Zhèr bù shuō Yīngyǔ, shuō Hànyǔ! Zhè wèi shì wǒmen de zhùjiào, Yáng xiǎojiě. | No English here, only Chinese! This is our teaching assistant, Miss Yang.
张教授 | 我看一下:马大为,美国人。陆雨平,法国人。宋华,俄罗斯人。陈先生,德国人。王小云,中国人。还有一位日本学生。 | Wǒ kàn yíxià: Mǎ Dàwéi, Měiguó rén. Lù Yǔpíng, Fǎguó rén. Sòng Huá, Èluósī rén. Chén xiānsheng, Déguó rén. Wáng Xiǎoyún, Zhōngguó rén. Hái yǒu yí wèi Rìběn xuésheng. | Let me see: Ma Dawei, American. Lu Yuping, French. Song Hua, Russian. Mr. Chen, German. Wang Xiaoyun, Chinese. And one Japanese student.
力波 | 请问,我们系有多少学生? | Qǐngwèn, wǒmen xì yǒu duōshao xuésheng? | May I ask, how many students are in our department?
张教授 | 一共一百一十个。男学生很多,女学生很少。 | Yígòng yìbǎi yìshí gè. Nán xuésheng hěn duō, nǚ xuésheng hěn shǎo. | 110 altogether. Lots of male students, very few female students.
林娜 | 啊,外国学生真多! | A, wàiguó xuésheng zhēn duō! | Wow, so many foreign students!
张教授 | 你们都是学生,都很忙啊!丁先生,请你介绍一下林娜。 | Nǐmen dōu shì xuésheng, dōu hěn máng a! Dīng xiānsheng, qǐng nǐ jièshào yíxià Lín Nà. | You are all students, and all busy! Mr. Ding, please introduce Lin Na.
力波 | 她叫林娜,是英国人。她很有意思! | Tā jiào Lín Nà, shì Yīngguó rén. Tā hěn yǒuyìsi! | She's Lin Na, she's British. She's very interesting!
张教授 | 好。你们选修什么? | Hǎo. Nǐmen xuǎnxiū shénme? | Good. What electives are you taking?
林娜 | 我选修美术、音乐、文学。你呢? | Wǒ xuǎnxiū měishù, yīnyuè, wénxué. Nǐ ne? | Art, music, literature. And you?
力波 | 我选修物理、化学、数学。 | Wǒ xuǎnxiū wùlǐ, huàxué, shùxué. | Physics, chemistry, math.
林娜 | 啊,你太忙了! | A, nǐ tài máng le! | Ah, you're so busy!
力波 | 历史、哲学、经济,我都没有选修。 | Lìshǐ, zhéxué, jīngjì, wǒ dōu méiyǒu xuǎnxiū. | History, philosophy, economics, I take none of them.
张教授 | 你们要学习汉语,也要学习中国文化。 | Nǐmen yào xuéxí Hànyǔ, yě yào xuéxí Zhōngguó wénhuà. | You must study Chinese, and Chinese culture too.
林娜 | 我还要看京剧! | Wǒ hái yào kàn jīngjù! | I also want to see Beijing opera!
张教授 | 好!请你们说一遍:我爱汉语! | Hǎo! Qǐng nǐmen shuō yí biàn: Wǒ ài Hànyǔ! | Good! Say it once, everyone: I love Chinese!
[三 · 照片,家人]
旁白 | 林娜和力波在餐厅喝咖啡。林娜的电脑很小,词典很大。 | Lín Nà hé Lìbō zài cāntīng hē kāfēi. Lín Nà de diànnǎo hěn xiǎo, cídiǎn hěn dà. | Lin Na and Libo drink coffee in the restaurant. Her computer is small, her dictionary is big.
林娜 | 你看这张照片!这是我家人。 | Nǐ kàn zhè zhāng zhàopiàn! Zhè shì wǒ jiā rén. | Look at this photo! This is my family.
力波 | 你家有几口人? | Nǐ jiā yǒu jǐ kǒu rén? | How many people are in your family?
林娜 | 五口人:爸爸、妈妈、哥哥、妹妹和我。 | Wǔ kǒu rén: bàba, māma, gēge, mèimei hé wǒ. | Five: dad, mom, older brother, younger sister and me.
力波 | 你爸爸、妈妈做什么工作? | Nǐ bàba, māma zuò shénme gōngzuò? | What do your mom and dad do for work?
林娜 | 爸爸是医生,妈妈是记者。哥哥是律师,他有两个孩子。 | Bàba shì yīshēng, māma shì jìzhě. Gēge shì lǜshī, tā yǒu liǎng gè háizi. | Dad is a doctor, mom is a journalist. My brother is a lawyer, he has two children.
力波 | 孩子可爱吗? | Háizi kěài ma? | Are the kids cute?
林娜 | 真可爱!外公、外婆也在英国,我常常去看他们。 | Zhēn kěài! Wàigōng, wàipó yě zài Yīngguó, wǒ chángcháng qù kàn tāmen. | So cute! Grandpa and grandma are in Britain too, I often go to see them.
林娜 | 你家呢? | Nǐ jiā ne? | And your family?
力波 | 我家一共有八口人:爸爸、妈妈、爷爷、奶奶、哥哥、姐姐、弟弟和我。 | Wǒ jiā yígòng yǒu bā kǒu rén: bàba, māma, yéye, nǎinai, gēge, jiějie, dìdi hé wǒ. | Eight in all: dad, mom, paternal grandpa and grandma, older brother, older sister, younger brother and me.
林娜 | 你家人真多!他们都工作吗? | Nǐ jiā rén zhēn duō! Tāmen dōu gōngzuò ma? | Your family is so big! Do they all work?
力波 | 爸爸是教授,妈妈是老师。哥哥是医生,姐姐是工程师,弟弟还是学生。 | Bàba shì jiàoshòu, māma shì lǎoshī. Gēge shì yīshēng, jiějie shì gōngchéngshī, dìdi hái shì xuésheng. | Dad is a professor, mom is a teacher. Brother is a doctor, sister is an engineer, my younger brother is still a student.
林娜 | 你爸爸有车吗? | Nǐ bàba yǒu chē ma? | Does your dad have a car?
力波 | 有,他的车很大。他工作很忙,常常不在家。 | Yǒu, tā de chē hěn dà. Tā gōngzuò hěn máng, chángcháng bú zài jiā. | Yes, his car is big. He's busy at work and often not home.
林娜 | 那谁在家呢? | Nà shéi zài jiā ne? | Then who is home?
力波 | 贝贝!贝贝是我家的狗,很小,很可爱。我爱贝贝! | Bèibei! Bèibei shì wǒ jiā de gǒu, hěn xiǎo, hěn kěài. Wǒ ài Bèibei! | Beibei! Beibei is our dog, small and cute. I love Beibei!
林娜 | 我喜欢狗!你有贝贝的照片吗? | Wǒ xǐhuan gǒu! Nǐ yǒu Bèibei de zhàopiàn ma? | I like dogs! Do you have a photo of Beibei?
力波 | 当然有!看,这是贝贝。 | Dāngrán yǒu! Kàn, zhè shì Bèibei. | Of course! Look, this is Beibei.
林娜 | 你的汉语真好!你学习汉语几年了? | Nǐ de Hànyǔ zhēn hǎo! Nǐ xuéxí Hànyǔ jǐ nián le? | Your Chinese is really good! How many years have you studied it?
力波 | 我学习了一年汉语。两年前,我去了中国。 | Wǒ xuéxí le yì nián Hànyǔ. Liǎng nián qián, wǒ qù le Zhōngguó. | I've studied it for one year. Two years ago, I went to China.
[四 · 宿舍,很晚了]
旁白 | 现在很晚了。力波和林娜去宿舍。 | Xiànzài hěn wǎn le. Lìbō hé Lín Nà qù sùshè. | It's late now. Libo and Lin Na go to the dorm.
林娜 | 你的宿舍在哪儿? | Nǐ de sùshè zài nǎr? | Where is your dorm?
力波 | 在二层,二零四号。你要去看一下吗? | Zài èr céng, èr líng sì hào. Nǐ yào qù kàn yíxià ma? | 2nd floor, room 204. Do you want to go and have a look?
林娜 | 可以吗? | Kěyǐ ma? | Is that okay?
力波 | 行! | Xíng! | Sure!
马大为 | 你们……啊!抱歉!我在这儿! | Nǐmen... a! Bàoqiàn! Wǒ zài zhèr! | You two... ah! Sorry! I'm right here!
力波 | 马大为!你在宿舍啊? | Mǎ Dàwéi! Nǐ zài sùshè a? | Ma Dawei! You're in the dorm?
林娜 | 他真高! | Tā zhēn gāo! | He's so tall!
马大为 | 是!请问,五十六加十二是多少? | Shì! Qǐngwèn, wǔshíliù jiā shí'èr shì duōshao? | Yes! May I ask, what is 56 plus 12?
力波 | 五十六加十二是六十八。 | Wǔshíliù jiā shí'èr shì liùshíbā. | 56 plus 12 is 68.
林娜 | 七十八减二十一是多少? | Qīshíbā jiǎn èrshíyī shì duōshao? | What is 78 minus 21?
马大为 | 五十七。六乘七呢? | Wǔshíqī. Liù chéng qī ne? | 57. And 6 times 7?
力波 | 四十二。九十九加一是多少? | Sìshí'èr. Jiǔshíjiǔ jiā yī shì duōshao? | 42. What is 99 plus 1?
林娜 | 一百! | Yìbǎi! | 100!
力波 | 一百零一加一百一十呢? | Yìbǎi líng yī jiā yìbǎi yìshí ne? | And 101 plus 110?
马大为 | 二百一十一!谢谢你们! | Èrbǎi yìshí yī! Xièxie nǐmen! | 211! Thank you both!
林娜 | 不用谢!我们三个人真有意思。 | Bú yòng xiè! Wǒmen sān gè rén zhēn yǒuyìsi. | No need to thank us! The three of us are fun.
马大为 | 恐怕我要去游泳了。 | Kǒngpà wǒ yào qù yóuyǒng le. | I'm afraid I have to go swimming.
林娜 | 现在很晚了,游泳? | Xiànzài hěn wǎn le, yóuyǒng? | It's late now, swimming?
马大为 | 那我去打球!再见! | Nà wǒ qù dǎqiú! Zàijiàn! | Then I'll go play ball! Bye!
力波 | 再见! | Zàijiàn! | Bye!
林娜 | 咖啡呢? | Kāfēi ne? | Where's the coffee?
力波 | 对不起……恐怕我没有咖啡。 | Duìbuqǐ... kǒngpà wǒ méiyǒu kāfēi. | Sorry... I'm afraid I don't have any coffee.
林娜 | 啊?你太有意思了! | A? Nǐ tài yǒuyìsi le! | Huh? You're so funny!
力波 | 林娜,你……我……你是我的…… | Lín Nà, nǐ... wǒ... nǐ shì wǒ de... | Lin Na, you... I... you are my...
林娜 | 你说什么? | Nǐ shuō shénme? | What are you saying?
力波 | 我……我…… | Wǒ... wǒ... | I... I...
林娜 | 我知道。你是我的男朋友吗? | Wǒ zhīdào. Nǐ shì wǒ de nánpéngyou ma? | I know. Will you be my boyfriend?
力波 | 是!太高兴了!你什么时候有时间? | Shì! Tài gāoxìng le! Nǐ shénme shíhou yǒu shíjiān? | Yes! So happy! When are you free?
林娜 | 明天、今天、现在……都有! | Míngtiān, jīntiān, xiànzài... dōu yǒu! | Tomorrow, today, now... all of them!

<div class="bar">
  <a href="index.html">&larr; Words</a>
  <span class="sp"></span>
  <button id="tn" aria-pressed="true" title="Color pinyin by tone">Tones</button>
  <button id="all" aria-pressed="false" title="Show or hide every pinyin and meaning">Show all</button>
</div>

<main id="m"></main>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

/* pinyin tone colouring (same as index.html) */
var V='aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ',TM={'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4},
 SYL=new RegExp('(?:zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?['+V+']+(?:ng|n|r)?(?!['+V+'])','gi');
function tonify(s){var f=document.createDocumentFragment(),last=0,m;SYL.lastIndex=0;
 while((m=SYL.exec(s))){
  if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));
  var tn=5,w=m[0].toLowerCase();for(var i=0;i<w.length;i++){if(TM[w[i]]){tn=TM[w[i]];break}}
  var sp=el('span','t'+tn,m[0]);f.appendChild(sp);last=m.index+m[0].length}
 if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));return f}

/* build page */
var raw=$('#story').textContent.split('\n'),m=$('#m'),sec=null,inDrills=false;
var h1=el('h1','zh','林娜和丁力波');m.appendChild(h1);m.appendChild(el('p','sub','Lín Nà hé Dīng Lìbō · tap a line to show pinyin and meaning'));
var box=m;
raw.forEach(function(ln){
  ln=ln.trim();if(!ln)return;
  if(ln==='@@'){inDrills=true;m.appendChild(el('h2',null,'句型替换 · PATTERN DRILLS'));box=el('section','ch');m.appendChild(box);return}
  var h=ln.match(/^\[(.+)\]$/);
  if(h){m.appendChild(el('h2',null,h[1]));box=el('section','ch');m.appendChild(box);return}
  var c=ln.split('|').map(function(x){return x.trim()});
  if(inDrills){
    var d=el('div','d'),p=el('div','p zh',c[0]),w=el('div','w zh');
    (c[1]||'').split(/\s*([·‖])\s*/).forEach(function(x){if(x==='·'||x==='‖'){w.appendChild(el('s',null,x))}else if(x){w.appendChild(document.createTextNode(x))}});
    d.appendChild(p);d.appendChild(w);box.appendChild(d);return}
  if(c.length<4)return;
  var b=el('button','l');b.type='button';b.setAttribute('aria-expanded','false');
  b.appendChild(el('span','who',c[0]));
  b.appendChild(el('span','t zh',c[1]));
  var more=el('span','more'),inner=el('span'),py=el('span','py');
  py.appendChild(tonify(c[2]));inner.appendChild(py);inner.appendChild(el('span','en',c[3]));more.appendChild(inner);b.appendChild(more);
  b.addEventListener('click',function(){
    if(String(getSelection()))return; /* let people select text without toggling */
    b.setAttribute('aria-expanded',b.getAttribute('aria-expanded')==='true'?'false':'true')});
  box.appendChild(b);
});

/* show all */
var all=$('#all');
all.addEventListener('click',function(){var v=all.getAttribute('aria-pressed')!=='true';
  all.setAttribute('aria-pressed',v?'true':'false');all.textContent=v?'Hide all':'Show all';
  document.body.classList.toggle('all',v);
  if(!v)document.querySelectorAll('.l[aria-expanded=true]').forEach(function(b){b.setAttribute('aria-expanded','false')})});

/* tones: shares the setting with the word list */
var tn=$('#tn');
function setTc(v){document.body.classList.toggle('tc',v);tn.setAttribute('aria-pressed',v?'true':'false');sset('mv_tc',v?'1':'0')}
tn.addEventListener('click',function(){setTc(!document.body.classList.contains('tc'))});
setTc(sget('mv_tc')!=='0');

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
