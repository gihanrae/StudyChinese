<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandarin Vocabulary</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fafaf7">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#fafaf7;--fg:#1c1c1a;--mut:#6b6b66;--ln:#e2e0d8;--gh:#c9c7be;--s:42%;--l:93%;--bl:83%;--dl:66%;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--fg:#ececea;--mut:#9a9a95;--ln:#2e2e30;--gh:#4a4a4f;--s:20%;--l:20%;--bl:29%;--dl:55%;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:11px/1.2 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{padding:env(safe-area-inset-top,0) 8px 0;-webkit-tap-highlight-color:transparent}
.zh{font-family:"LXGW WenKai TC","Kaiti SC",STKaiti,KaiTi,"楷体",serif}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:5px 0}
.bar .z{display:flex;align-items:center;gap:6px;color:var(--mut)}
.bar input[type=range]{width:90px}
.lg{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--mut)}
.lg span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lg i,.sw i{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) calc(var(--s)*var(--sm,1)*1.6) var(--dl))}
.sp{flex:1}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:26px;height:14px;border-radius:7px;background:var(--ln);border:0;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--bg);transition:transform .15s}
.sw input:checked+i{background:var(--fg)}
.sw input:checked+i::after{transform:translateX(12px)}
.sw input:focus-visible+i{outline:2px solid var(--mut);outline-offset:2px}
button{font:inherit;color:var(--fg);background:none;border:1px solid var(--ln);border-radius:6px;padding:2px 8px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--mut)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--mut);outline-offset:1px}
a.gh{display:inline-flex;align-items:center;color:var(--mut);padding:2px}a.gh:hover{color:var(--fg)}a.gh:focus-visible{outline:2px solid var(--mut);outline-offset:2px;border-radius:4px}a.gh svg{width:16px;height:16px;fill:currentColor}
#rs{display:none}
body.game #rs{display:inline-block}

/* add panel */
#ap{position:absolute;top:100%;right:0;z-index:7;width:min(340px,100%);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:6px}
#ap[hidden]{display:none}
#ap textarea{font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px;resize:vertical;min-height:54px}
#ap .r{display:flex;gap:6px;align-items:center}
#ap select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:2px 4px}
#am{color:var(--mut);flex:1;text-align:right}

/* cards */
main{padding:2px 0 calc(40px*var(--z,1) + 70px + env(safe-area-inset-bottom,0px))}
.g8{display:grid;grid-template-columns:repeat(auto-fill,calc(72px*var(--z,1)));justify-content:start;gap:4px}
.c{--k:hsl(var(--h) calc(var(--s)*var(--sm,1)) var(--l));background:var(--k);border:1px solid hsl(var(--h) calc(var(--s)*var(--sm,1)) var(--bl));border-radius:6px;padding:3px 2px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-width:0;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .12s ease;contain:layout style}
.c:active{transform:scale(.95)}
.c:focus-visible{outline:2px solid var(--mut);outline-offset:1px}
.c.lift{opacity:.35}
@keyframes pop{0%{transform:scale(.92)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
.c.pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.c .py,.c em{opacity:0;transform:translateY(5px);transition:opacity .2s ease,transform .35s cubic-bezier(.34,1.56,.64,1);overflow-wrap:anywhere}
.c .py{font-size:calc(9.5px*var(--z,1));color:var(--fg)}
.c em{font-style:normal;font-size:calc(9px*var(--z,1));line-height:1.1;color:var(--mut)}
.c[data-s="1"] .py,.c[data-s="2"] .py,.c[data-s="2"] em{opacity:1;transform:none}
.c[data-s="2"] em{transition-delay:.08s}
@media (prefers-reduced-motion:reduce){.c.pop{animation:none}.c .py,.c em{transform:none;transition:opacity .15s}}

/* glyphs: static stroke-font glyph, swapped for the animated one on hover */
.gl{position:relative;display:flex;align-items:center;justify-content:center;height:calc(var(--cs)*1px*var(--z,1))}
.g{display:inline-block;flex:none;width:calc(var(--cs)*1px*var(--z,1));height:calc(var(--cs)*1px*var(--z,1));line-height:1;transition:opacity .2s}
.g svg{display:block;width:100%;height:100%;fill:var(--fg)}
.g.fb{font-family:"LXGW WenKai TC","Kaiti SC",STKaiti,KaiTi,"楷体",serif;font-size:calc(var(--cs)*.8px*var(--z,1));text-align:center}
.wr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .2s}
.wc{position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px 0 0 -50px;transform:translateX(calc((var(--i) - (var(--n) - 1)/2)*var(--cs)*1px*var(--z,1))) scale(calc(var(--cs)*var(--z,1)/100))}
.c[data-h="1"] .wr{opacity:1}
.c[data-h="1"] .g{opacity:0!important}

/* controls */
#q,#ls,#al{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:2px 6px}
#q{width:96px}#ls[hidden]{display:none}#al{width:64px}
#q:focus,#ti:focus,#at:focus{outline:none;border-color:var(--mut)}
button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#dr{display:none}body.game #dr{display:inline-block}
.x{display:none!important}
@keyframes cin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.c.in{animation:cin .34s cubic-bezier(.2,.8,.3,1) both}
body.game.rev .c em{order:-1;opacity:1;transform:none;font-size:calc(11px*var(--z,1));color:var(--fg);padding:1px}
body.game.rev .c .gl,body.game.rev .c .py{opacity:0;transform:none;transition:opacity .2s}
body.game.rev .c[data-s="1"] .gl,body.game.rev .c[data-s="2"] .gl,body.game.rev .c[data-s="1"] .py,body.game.rev .c[data-s="2"] .py{opacity:1}
.g.fb:not(.fail){opacity:.45}


/* sentence dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--ln);display:flex;gap:8px;align-items:stretch;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#box{flex:1;min-width:0;min-height:calc(26px*var(--z,1) + 12px);display:flex;gap:4px;align-items:center;overflow-x:auto;border:1.5px dashed var(--ln);border-radius:8px;padding:3px 6px;scrollbar-width:thin}
#cw{display:flex;gap:4px;align-items:center;flex:none}
#ti{flex:1;min-width:84px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:4px 2px}
#ti::placeholder{color:var(--mut);opacity:.75}
#box:not(.empty) #ti::placeholder{color:transparent}
#ti.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chip{--cs:26;flex:none;display:flex;flex-direction:column;align-items:center;padding:2px 4px;border-radius:6px;cursor:grab;background:hsl(var(--h) calc(var(--s)*var(--sm,1)) var(--l));border:1px solid hsl(var(--h) calc(var(--s)*var(--sm,1)) var(--bl));user-select:none;-webkit-user-select:none}
.chip .gr{display:flex}
.chip .cp{display:none;font-size:calc(9px*var(--z,1));color:var(--mut);white-space:nowrap}
body.dpy .chip .cp{display:block}
.chip.lift{opacity:.35}
@keyframes chipin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.chip.new{animation:chipin .3s cubic-bezier(.34,1.56,.64,1)}
.ph{flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--mut)}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;margin:0;opacity:.94;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:none!important;animation:none!important;will-change:transform}
.db{display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:flex-end;width:132px}
#sv,#sg{position:absolute;bottom:calc(100% + 6px);background:var(--bg);border:1px solid var(--ln);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;overflow:auto}
#sv[hidden],#sg[hidden]{display:none}
#sv{right:8px;width:min(360px,calc(100% - 16px));max-height:45vh}
#sg{left:8px;width:min(300px,calc(100% - 16px))}
.sr,.sgi{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
.sr:hover,.sgi:hover,.sgi.on{background:var(--ln)}
.sr .t{flex:1;min-width:0}.sh{font:16px/1.2 "LXGW WenKai TC",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp2{color:var(--mut);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr button{border:0;padding:0 6px;font-size:14px;color:var(--mut)}
.sgi b{font:16px "LXGW WenKai TC",serif;min-width:2.2em}.sgi span{color:var(--fg)}.sgi em{font-style:normal;color:var(--mut);margin-left:auto}

/* tones */
:root{--tl:38%}
@media (prefers-color-scheme:dark){:root{--tl:70%}}
body.tc .t1{color:hsl(212 62% var(--tl))}body.tc .t2{color:hsl(140 52% var(--tl))}body.tc .t3{color:hsl(30 70% var(--tl))}body.tc .t4{color:hsl(352 62% var(--tl))}body.tc .t5{color:var(--mut)}
.tl{display:inline-flex;gap:4px}.tl i{font-style:normal;font-weight:700}
/* example tip */
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:5px 10px;font:15px/1.3 "LXGW WenKai TC","Kaiti SC",STKaiti,KaiTi,serif;max-width:min(320px,90vw);opacity:0;transform:translateY(4px);transition:opacity .18s,transform .25s cubic-bezier(.2,.8,.3,1)}
#tip.on{opacity:1;transform:none}
/* weak / tag / write */
#wk{display:none}body.game #wk{display:inline-block}
.c{position:relative}
body.tag .c:not([data-l=""])::after{content:attr(data-l);position:absolute;top:1px;right:3px;font-size:9px;font-weight:700;color:var(--mut)}
body.tag .c{cursor:copy}
#wm{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;animation:fadein .18s ease}
#wm[hidden]{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.wb{position:relative;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:96vw;animation:pop2 .28s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop2{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
#wx{position:absolute;top:4px;right:4px;border:0;font-size:16px;color:var(--mut)}
.wt{display:flex;gap:8px;align-items:baseline;font-size:14px;padding:0 22px}.wt span{color:var(--mut)}
.wq{display:flex;gap:6px}
.wq>div{border:1px solid var(--ln);border-radius:8px;background:linear-gradient(var(--ln),var(--ln)) center/1px 100% no-repeat,linear-gradient(var(--ln),var(--ln)) center/100% 1px no-repeat}
.wq svg{touch-action:none;display:block}
.wa{display:flex;gap:6px}

/* compact bar + controls panel */
.bar{gap:6px 8px;padding:5px 0}
#q{flex:1 1 120px;max-width:260px;min-width:0}
#g2{display:none;gap:6px}
body.game #g2{display:flex}
#cp{position:absolute;top:100%;left:0;right:0;z-index:8;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);animation:pop2 .22s cubic-bezier(.2,.8,.3,1)}
#cp[hidden]{display:none}
#cp .cr #q{flex:1 1 140px;max-width:none}
.how{border-collapse:collapse;width:100%;color:var(--mut)}
.how td{padding:3px 0;vertical-align:top}.how td:first-child{color:var(--fg);white-space:nowrap;padding-right:14px;font-weight:600}.how i{font-style:normal;opacity:.7}
#cp .z{display:flex;align-items:center;gap:8px;color:var(--mut)}#cp .z input{flex:1;width:auto}
#cp .lg{gap:4px 12px}
.cr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#cp #ap{position:static;width:100%;border:0;box-shadow:none;padding:0}
.ghost{position:fixed!important}
@media (pointer:coarse){
 button,#q,#ls,#al,#ac{min-height:40px;font-size:14px;padding:6px 14px}
 #q{font-size:16px}#ti{font-size:16px}
 .sw{min-height:40px;gap:8px}.sw i{width:40px;height:22px;border-radius:11px}.sw i::after{width:16px;height:16px;top:3px;left:3px}.sw input:checked+i::after{transform:translateX(18px)}
 #cp .z input{height:32px}
 a.gh{padding:8px}a.gh svg{width:22px;height:22px}
 .lg{font-size:12px}.lg i{width:11px;height:11px}
 #dock .db{width:176px;gap:6px}#dock .db button{min-height:38px;padding:4px 12px}
 .tl{font-size:14px}
 main{padding-bottom:calc(40px*var(--z,1) + 120px + env(safe-area-inset-bottom,0px))}
 #sv .sr button{min-height:36px}
}
</style>
</head>

<!-- ============================================================
     VOCABULARY  (edit here)
     One word per line:   汉字 | pinyin | english | example sentence
     Put it under the section it belongs to:
       [people] [things] [subjects] [verbs] [adj] [pron] [other]
     Or use the "+" button in the page to paste new words.
     ============================================================ -->
<script id="vocab" type="text/plain">
[people]
爸爸 | bàba | dad | 我爸爸是医生。

弟弟 | dìdi | younger brother | 我弟弟是学生。
人 | rén | person | 他是好人。
老师 | lǎoshī | teacher | 她是老师。
医生 | yīshēng | doctor | 他是医生。

外婆 | wàipó | maternal grandma | 外婆喝咖啡。
记者 | jìzhě | journalist | 她是记者。
先生 | xiānsheng | Mr. / sir | 王先生好。
小姐 | xiǎojiě | Miss | 王小姐是老师。
学生 | xuésheng | student | 我是学生。
教授 | jiàoshòu | professor | 陈教授教了我汉语。
中国 | Zhōngguó | China | 我去中国。
英国 | Yīngguó | UK | 他是英国人。
加拿大 | Jiānádà | Canada | 她是加拿大人。
美国 | Měiguó | USA | 我去美国。
法国 | Fǎguó | France | 他是法国人。
德国 | Déguó | Germany | 她是德国人。
俄罗斯 | Èluósī | Russia | 他是俄罗斯人。
日本 | Rìběn | Japan | 我们去日本。
丁 | Dīng | Ding (name) | 丁先生是医生。
陈 | Chén | Chen (name) | 陈老师教汉语。
杨 | Yáng | Yang (name) | 杨教授是中国人。
张 | Zhāng | Zhang (name) | 这是张老师。
马大为 | Mǎ Dàwéi | Ma Dawei (name) | 马大为是学生。
王小云 | Wáng Xiǎoyún | Wang Xiaoyun (name) | 王小云是我朋友。
宋华 | Sòng Huá | Song Hua (name) | 宋华是老师。
林娜 | Lín Nà | Lin Na (name) | 林娜是加拿大人。
力波 | Lì Bō | Libo (name) | 力波去中国。
陆雨平 | Lù Yǔpíng | Lu Yuping (name) | 陆雨平是医生。
丁力波 | Dīng Lìbō | Ding Libo (name) | 丁力波的朋友是谁？
吉汉锐 | Jí Hànruì | Ji Hanrui (name) | 吉汉锐是学生。

[things]
咖啡 | kāfēi | coffee | 我喝咖啡。
国 | guó | country | 中国
外语 | wàiyǔ | foreign language | 我学习外语。
语言 | yǔyán | language | 汉语是语言。
学院 | xuéyuàn | institute / college | 外语学院
汉语 | Hànyǔ | Chinese | 汉语很有意思。
普通话 | pǔtōnghuà | Mandarin | 我学习普通话。
餐厅 | cāntīng | restaurant | 餐厅在哪儿？
宿舍 | sùshè | dorm | 我的宿舍很好。
层 | céng | floor | 二层
号 | hào | number / day | 我的宿舍是四号。
天气 | tiānqì | weather | 今天天气很好。
昨天 | zuótiān | yesterday | 昨天我喝咖啡了。
今天 | jīntiān | today | 今天你喝什么？
明天 | míngtiān | tomorrow | 我明天不去中国。
京剧 | jīngjù | Beijing opera | 我要看京剧。
时间 | shíjiān | time | 现在是什么时间？
名片 | míngpiàn | business card | 这是我的名片。
名字 | míngzi | name | 你的名字是什么？
文化 | wénhuà | culture | 我也要学中国文化。
教育 | jiàoyù | education | 我们学院的教育很好。
中文 | Zhōngwén | Chinese (language) | 中文很难吗？
系 | xì | department | 我是中文系。
专业 | zhuānyè | major / speciality | 你的专业是什么？
二 | èr | two | 二号
零 | líng | zero | 零四号
四 | sì | four | 四号

[subjects]
美术 | měishù | fine arts | 我学习美术。
文学 | wénxué | literature | 他们都学习中国文学。
物理 | wùlǐ | physics | 你学习物理吗？
化学 | huàxué | chemistry | 我哥哥学习化学。
数学 | shùxué | mathematics | 我爸爸不是数学老师。
音乐 | yīnyuè | music | 我要学音乐。
历史 | lìshǐ | history | 杨老师教历史。
哲学 | zhéxué | philosophy | 这是我们的哲学老师。
经济 | jīngjì | economics | 我学经济专业。

[verbs]
是 | shì | to be | 我是中国人。
喝 | hē | drink | 你喝什么？
认识 | rènshi | know (a person) | 认识你很高兴。
进来 | jìnlái | come in | 请进来。
请 | qǐng | please / invite | 请坐。
请问 | qǐngwèn | may I ask | 请问，你叫什么？
叫 | jiào | to be called | 我叫大为。
学习 | xuéxí | study | 我学习汉语。
在 | zài | be at | 他在宿舍。
坐 | zuò | sit | 请坐。
知道 | zhīdào | know (a fact) | 我知道。
要 | yào | want | 我要咖啡。
去 | qù | go | 我们去中国。
游泳 | yóuyǒng | swim | 我们去游泳了。
说 | shuō | speak / say | 他说汉语。
打球 | dǎqiú | play ball | 我们明天打球。
有 | yǒu | have / exist | 我有咖啡。
没有 | méiyǒu | not have | 我没有哥哥。
开学 | kāixué | school opens | 他明天开学。
看 | kàn | look / see / watch | 你们看这儿。
教 | jiāo | teach | 陈教授教了我汉语。
介绍 | jièshào | to introduce | 我介绍我爸爸。
选修 | xuǎnxiū | to take as an elective | 我选修了历史。

[adj]
好 | hǎo | good | 我很好。
忙 | máng | busy | 我很忙。
男 | nán | male | 他是我男朋友。
女 | nǚ | female | 她是我女朋友。
高兴 | gāoxìng | happy | 我很高兴。
晚 | wǎn | late | 对不起，我晚了。
有意思 | yǒu yìsi | interesting | 汉语很有意思。
高 | gāo | tall / high | 他不高。

[pron]

/* type to add words: hanzi (IME), pinyin without tones, or English */
var sg=$('#sg'),sgl=[],sgi=-1,sgStrip=0,HANRE=/[\u3400-\u9fff]/;
function find(q){
 var qn=norm(q).replace(/[^a-z0-9]/g,'');if(!qn)return [];
 var out=[];
 items.forEach(function(i,idx){var sc=-1;
  if(i.pn===qn)sc=0;
  else if(i.ew.indexOf(qn)>=0)sc=1;
  else if(i.pn.indexOf(qn)===0)sc=2;
  else if(i.ew.some(function(w){return w.indexOf(qn)===0}))sc=3;
  else if(i.pn.indexOf(qn)>=0)sc=5;
  else if(norm(i.e).indexOf(qn)>=0)sc=6;
  if(sc>=0)out.push([sc,i.pn.length,idx,i])});
 out.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]||a[2]-b[2]});
 return out.map(function(x){return x[3]})}
function hanIndex(){var m={},mx=1;items.forEach(function(i){if(!m[i.hn])m[i.hn]=i;if(i.hn.length>mx)mx=i.hn.length});return {m:m,mx:mx}}
function sgShow(list){
 sgl=list.slice(0,6);sgi=-1;sg.textContent='';
 if(!sgl.length){sg.hidden=true;return}
 sgl.forEach(function(it){var r=document.createElement('div');r.className='sgi';
  var a=document.createElement('b');a.className='zh';a.textContent=it.h;
  var p=document.createElement('span');p.textContent=it.p;
  var e=document.createElement('em');e.textContent=it.e;
  r.appendChild(a);r.appendChild(p);r.appendChild(e);
  r.addEventListener('mousedown',function(ev){ev.preventDefault()});
  r.addEventListener('click',function(){pick(it)});
  sg.appendChild(r)});
 sg.hidden=false}
function sgMark(){Array.prototype.forEach.call(sg.children,function(c,i){c.classList.toggle('on',i===sgi)})}
function suggest(){
 var v=ti.value,m=v.match(/(\S+)$/),t=m?m[1]:'';
 if(!t){sgShow([]);return}
 if(HANRE.test(t)){var r=t.match(/[\u3400-\u9fff…]+$/),run=r?r[0]:'';sgStrip=run.length;
  sgShow(run?items.filter(function(i){return i.hn.indexOf(run)===0}).sort(function(a,b){return a.hn.length-b.hn.length}):[])}
 else{sgStrip=t.length;sgShow(find(t))}}
function pick(it){ti.value=ti.value.slice(0,ti.value.length-sgStrip).replace(/\s+$/,'');addWords([it]);sgShow([]);ti.focus()}
function commit(){
 var v=ti.value.trim();if(!v)return;
 var H=hanIndex(),got=[],left=[];
 v.split(/\s+/).forEach(function(tok){
  if(HANRE.test(tok)){
   var i=0,rest='';
   while(i<tok.length){var hit=null,j=Math.min(tok.length,i+H.mx);
    for(;j>i;j--){hit=H.m[tok.slice(i,j)];if(hit)break}
    if(hit){got.push(hit);i=j}else{if(HANRE.test(tok[i]))rest+=tok[i];i++}}
   if(rest)left.push(rest)}
  else{var b=find(tok)[0];if(b)got.push(b);else left.push(tok)}});
 if(got.length)addWords(got);
 ti.value=left.join(' ');sgShow([]);
 if(left.length){ti.classList.remove('bad');void ti.offsetWidth;ti.classList.add('bad')}}
ti.addEventListener('keydown',function(e){
 if(e.isComposing||e.keyCode===229)return;
 if(e.key==='ArrowDown'&&!sg.hidden){e.preventDefault();sgi=(sgi+1)%sgl.length;sgMark()}
 else if(e.key==='ArrowUp'&&!sg.hidden){e.preventDefault();sgi=(sgi-1+sgl.length)%sgl.length;sgMark()}
 else if(e.key==='Enter'){e.preventDefault();if(!sg.hidden&&sgi>=0)pick(sgl[sgi]);else commit()}
 else if(e.key==='Backspace'&&!ti.value&&dock.length){dock.pop();renderDock()}});
ti.addEventListener('input',suggest);
ti.addEventListener('blur',function(){setTimeout(function(){sgShow([])},120)});

/* ---- drag (mouse: move; touch: hold, then move) ---- */
var st=null,gh=null,src=null,dragIt=null,fromIdx=-1,cx=0,cy=0,ox=0,oy=0,lastPh=-2,raf=0;
function overDock(){var r=$('#dock').getBoundingClientRect();return cy>=r.top&&cy<=r.bottom&&cx>=r.left&&cx<=r.right}
function insIndex(){var l=cw.querySelectorAll('.chip'),k=0;for(;k<l.length;k++){var r=l[k].getBoundingClientRect();if(cx<r.left+r.width/2)break}return k}
function put(){gh.style.transform='translate3d('+(cx-ox)+'px,'+(cy-oy)+'px,0) scale(1.06)'}
function place(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;if(gh)put()})}
function onHold(){
 if(!st||gh||wmode||tagmode)return;var el=st.el;st.held=true;setS(el,2);if(!canHover)hz(el,true)}
function begin(){
 var el=st.el;clearTimeout(st.t);
 if(el.classList.contains('c'))hide(el);
 var r=el.getBoundingClientRect();ox=cx-r.left;oy=cy-r.top;
 gh=el.cloneNode(true);gh.classList.add('ghost');gh.classList.remove('pop','lift','in','new');gh.removeAttribute('title');gh.removeAttribute('data-h');gh.removeAttribute('data-s');
 var w=gh.querySelector('.wr');if(w)w.remove();
 gh.style.width=r.width+'px';document.body.appendChild(gh);
 dragIt=el._it;src=el;
 if(el.classList.contains('chip')){fromIdx=Array.prototype.indexOf.call(cw.querySelectorAll('.chip'),el);dock.splice(fromIdx,1);renderDock(fromIdx);lastPh=fromIdx;src=null}
 else{fromIdx=-1;hz(el,false);el.classList.add('lift')}
 put()}
function finish(drop){
 if(!gh)return;
 cancelAnimationFrame(raf);raf=0;
 var idx=drop&&overDock()?insIndex():-1;
 if(idx>=0)dock.splice(idx,0,dragIt);
 else if(!drop&&fromIdx>=0)dock.splice(fromIdx,0,dragIt);
 gh.remove();gh=null;if(src)src.classList.remove('lift');src=null;lastPh=-2;
 renderDock(undefined,idx>=0?idx:null,1);if(idx>=0&&idx===dock.length-1)box.scrollLeft=box.scrollWidth;
 sup=true;setTimeout(function(){sup=false},60)}
document.addEventListener('pointerdown',function(e){
 if(e.button>0||gh)return;
 var el=e.target.closest('.c,.chip');if(!el)return;
 cx=e.clientX;cy=e.clientY;
 st={el:el,x:cx,y:cy,touch:e.pointerType==='touch',t:null,held:false};
 if(el.classList.contains('c'))st.t=setTimeout(onHold,350);
 else if(st.touch)st.t=setTimeout(function(){if(st&&!gh)begin()},260);
 if(!st.touch)e.preventDefault()});
document.addEventListener('pointermove',function(e){
 cx=e.clientX;cy=e.clientY;
 if(!st&&!gh)return;
 if(!gh){var dx=cx-st.x,dy=cy-st.y,d2=dx*dx+dy*dy;
  if(st.touch){if(st.held){if(d2>64)begin()}else if(d2>100){clearTimeout(st.t);st=null}}
  else if(d2>25)begin();
  return}
 place();
 var ph=overDock()?insIndex():null;
 if(ph!==lastPh){lastPh=ph;renderDock(ph)}});
document.addEventListener('pointerup',function(){
 if(st){clearTimeout(st.t);if(st.held&&!gh){sup=true;setTimeout(function(){sup=false},60);count(st.el)}}
 finish(true);st=null});
document.addEventListener('pointercancel',function(){
 if(st){clearTimeout(st.t);if(st.held&&!gh)hide(st.el)}
 finish(false);st=null});
document.addEventListener('touchmove',function(e){if(gh)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){if(e.target.closest('.c,.chip'))e.preventDefault()});

function guess(s){s=(s||'').toLowerCase();

 if(/subject|academic/.test(s))return'subjects';

  out.push('')});

 a.href=u;a.download='new-words.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);
